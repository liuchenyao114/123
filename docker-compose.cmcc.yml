# 基于本地源码构建：官方镜像 justsong/message-pusher 不包含新增的 cmcc 通道，
# 因此这里必须用 build，而不是 image。
# 用法：docker compose -f docker-compose.cmcc.yml up -d --build
services:
  message-pusher:
    build:
      context: .
      dockerfile: Dockerfile
    image: message-pusher-cmcc:local
    container_name: message-pusher-cmcc
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Shanghai
      # 必填：启动前用 `export SESSION_SECRET=$(openssl rand -hex 32)` 生成随机串
      - SESSION_SECRET=${SESSION_SECRET:?请先设置 SESSION_SECRET 环境变量}
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
